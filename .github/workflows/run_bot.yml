name: Run ESP Telegram Bot 24/7

concurrency:
  group: telegram-bot-session
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  schedule:
    # Backup safety net every 4 hours in case a run ever crashes
    - cron: '0 */4 * * *'

permissions:
  actions: write
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # Max allowed is 360 mins (6 hours)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Restore browser session cache
        uses: actions/cache@v4
        with:
          path: session_state.json
          key: session-state-${{ github.run_id }}
          restore-keys: |
            session-state-

      - name: Run Bot (for 5 hours 25 minutes)
        # Runs for 5h 25m (19500s), then exits cleanly so the next step can trigger a fresh run
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
        run: |
          timeout 19500s python bot.py || true

      - name: Trigger Next Run Immediately (Zero-Gap Handover)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering next bot session before this runner shuts down..."
          gh workflow run "run_bot.yml" --ref main || true
